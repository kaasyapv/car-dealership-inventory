name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite needs 22.5+
      - run: npm run install:all
      - name: Typecheck
        run: npm run typecheck
      - name: Backend tests (with coverage)
        run: npm run test:coverage --prefix backend
      - name: Frontend tests (with coverage)
        run: npm run test:coverage --prefix frontend
      - name: Install Chromium for end-to-end tests
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
